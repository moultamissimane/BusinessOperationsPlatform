name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Integration tests run against a real PostgreSQL, not an in-memory fake.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      WORKFLOW_TEST_PG: Host=localhost;Port=5432;Username=workflow;Password=workflow_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/tests/**/TestResults/*.trx

  docker-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t workflow-api:${{ github.sha }} backend
