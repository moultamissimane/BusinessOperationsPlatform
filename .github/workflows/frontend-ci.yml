name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "infra/**", "*.md"]
  pull_request:
    paths-ignore: ["backend/**", "infra/**", "*.md"]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint    # tsc --noEmit
      - run: npm run build
